---
- name: Configure Minecraft server
  hosts: minecraft
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - rsync
        state: present

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components:
          - stable
        architectures:
          - arm64
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install monitoring utilities
      become: true
      ansible.builtin.apt:
        name:
          - htop
          - iotop
          - ncdu
        state: present
        update_cache: true

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Create Minecraft directory
      ansible.builtin.file:
        path: /opt/minecraft
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy Minecraft Compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../minecraft/compose.yaml"
        dest: /opt/minecraft/compose.yaml
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Create Minecraft mods directory
      ansible.builtin.file:
        path: /opt/minecraft/mods
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy Minecraft mods
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../minecraft/mods/"
        dest: /opt/minecraft/mods/
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Check if world already exists on the server
      ansible.builtin.stat:
        path: /opt/minecraft/world/level.dat
      register: world_seeded

    - name: Create Minecraft world directory
      ansible.builtin.file:
        path: /opt/minecraft/world
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"
      when: not world_seeded.stat.exists

    - name: Seed Minecraft world via rsync (first run only)
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../minecraft/world/"
        dest: /opt/minecraft/world/
      become: false
      when: not world_seeded.stat.exists

    - name: Fix world ownership after rsync seed
      ansible.builtin.file:
        path: /opt/minecraft/world
        state: directory
        owner: ubuntu
        group: ubuntu
        recurse: true
      when: not world_seeded.stat.exists

    - name: Start Minecraft
      become_user: ubuntu
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/minecraft

    - name: Install UFW
      become: true
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    - name: Allow Minecraft
      become: true
      community.general.ufw:
        rule: allow
        port: "25565"
        proto: tcp

    - name: Allow Simple Voice Chat
      become: true
      community.general.ufw:
        rule: allow
        port: "24454"
        proto: udp

    - name: Create monitoring directory
      become: true
      ansible.builtin.file:
        path: /opt/monitoring
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy monitoring Compose file
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/compose.yaml"
        dest: /opt/monitoring/compose.yaml
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy Prometheus configuration
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/prometheus.yml"
        dest: /opt/monitoring/prometheus.yml
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Start monitoring stack
      become: true
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/monitoring
